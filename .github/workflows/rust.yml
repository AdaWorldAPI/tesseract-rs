name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}
  schedule:
    # Nightly, for the `quality` job (slow end-to-end regression fences).
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Pure-Rust transcode: no libtesseract / leptonica / clang at build time.
    # tesseract-core path-deps lance-graph-contract; tesseract-recognizer
    # path-deps ndarray (the int8 SIMD GEMM compute foundation). Check all three
    # out side by side so the ../../../lance-graph and ../../../ndarray path deps
    # resolve.
    - uses: actions/checkout@v4
      with:
        path: tesseract-rs
    - uses: actions/checkout@v4
      with:
        repository: AdaWorldAPI/lance-graph
        path: lance-graph
    - uses: actions/checkout@v4
      with:
        repository: AdaWorldAPI/ndarray
        path: ndarray
    - uses: actions/checkout@v4
      with:
        repository: AdaWorldAPI/OGAR
        path: OGAR
    # Only `tesseract-paperless --features token` needs this one; the default
    # build of every other crate never touches it. Checked out unconditionally
    # because a conditional checkout is one more thing that can silently stop
    # happening.
    - uses: actions/checkout@v4
      with:
        repository: AdaWorldAPI/tantivy
        path: tantivy
    # `lance-encoding` (pulled in by `tesseract-paperless --features store`
    # and by `tesseract-paperless-web`) compiles .proto files at build time.
    # `protobuf-compiler` alone ships `protoc` but not the well-known
    # includes (google/protobuf/empty.proto etc.) — `libprotobuf-dev` is
    # required alongside it, or the build fails with "File not found".
    - name: Install protoc (for lance-encoding)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
    # Workspace sweep pin (lance-graph #896 family): 1.97.1, matching the
    # repo's rust-toolchain.toml. ndarray's rust-version = 1.95 floor is
    # satisfied a fortiori.
    - name: Rust 1.97.1 toolchain
      run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt && rustup default 1.97.1
    - name: Build (core)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-core --verbose
    - name: Test (core)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-core --verbose
    - name: Clippy (core)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-core --all-targets -- -D warnings
    - name: Build (recognizer)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-recognizer --verbose
    - name: Test (recognizer)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-recognizer --verbose
    - name: Clippy (recognizer)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-recognizer --all-targets -- -D warnings
    - name: Build (ocr)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-ocr --verbose
    - name: Test (ocr)
      # Runs the golden suite: tests/golden_lines.rs + tests/golden_pages.rs
      # read the committed corpus/ fixtures. Hermetic: no network, no C++
      # tesseract at any point.
      working-directory: tesseract-rs
      run: cargo test -p tesseract-ocr --verbose
    - name: Clippy (ocr)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-ocr --all-targets -- -D warnings
    - name: Clippy (ocr, seg-approx)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-ocr --features seg-approx --all-targets -- -D warnings
    - name: Build (ocr-pdf)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-ocr-pdf --verbose
    - name: Test (ocr-pdf)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-ocr-pdf --verbose
    - name: Clippy (ocr-pdf)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-ocr-pdf --all-targets -- -D warnings
    - name: Build (ogar)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-ogar --verbose
    - name: Test (ogar)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-ogar --verbose
    - name: Clippy (ogar)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-ogar --all-targets -- -D warnings
    - name: Build (ocr-web)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-ocr-web --verbose
    - name: Test (ocr-web)
      # Uses the committed corpus/ model + pages; hermetic, no network.
      working-directory: tesseract-rs
      run: cargo test -p tesseract-ocr-web --verbose
    - name: Clippy (ocr-web)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-ocr-web --all-targets -- -D warnings
    # tesseract-paperless: a CONSUMER crate whose two interesting halves are
    # off by default. Every tier gets a line — a feature with no CI line is a
    # feature that rots, which is exactly how `spider_doc_ir` sat broken
    # against a field its own dependency had added.
    - name: Build (paperless, default)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-paperless --verbose
    - name: Test (paperless, default)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-paperless --verbose
    - name: Clippy (paperless, default)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-paperless --all-targets -- -D warnings
    - name: Clippy (paperless, ocr)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-paperless --features ocr --all-targets -- -D warnings
    - name: Test (paperless, token)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-paperless --features token --verbose
    - name: Clippy (paperless, token)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-paperless --features token --all-targets -- -D warnings
    # The probe IS the evidence for every `token` claim, and it carries its own
    # 41 gates, so running it is the gate. Release: the debug build of a
    # BPE merge loop over 170 KB is minutes slower for no added signal.
    - name: Probe (paperless, token seam)
      working-directory: tesseract-rs
      run: cargo run --release -p tesseract-paperless --features token --example probe_token_seam
    - name: Test (paperless, store)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-paperless --features store --verbose
    - name: Clippy (paperless, store)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-paperless --features store --all-targets -- -D warnings
    # A real, persistent Tantivy full-text index (BM25 + snippets) --
    # deliberately a SEPARATE feature from `token` (which pins tantivy to
    # `default-features = false`, RAM-only): `search` turns on `mmap` +
    # `stemmer` + `stopwords` + `lz4-compression` on the SAME dependency
    # entry, all pure Rust, so no C is introduced either way.
    - name: Test (paperless, search)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-paperless --features search --verbose
    - name: Clippy (paperless, search)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-paperless --features search --all-targets -- -D warnings
    # tesseract-paperless-web: the Railway-deployable document archive —
    # upload -> S-2 gate -> OCR -> DocIr -> lancedb + Tantivy search, with
    # the browse/search/delete UI. Depends on tesseract-paperless with
    # ocr+store+search on, so this is the first CI line that exercises that
    # three-way feature pairing end to end.
    - name: Build (paperless-web)
      working-directory: tesseract-rs
      run: cargo build -p tesseract-paperless-web --verbose
    - name: Test (paperless-web)
      working-directory: tesseract-rs
      run: cargo test -p tesseract-paperless-web --verbose
    - name: Clippy (paperless-web)
      working-directory: tesseract-rs
      run: cargo clippy -p tesseract-paperless-web --all-targets -- -D warnings
    - name: Check formatting
      # SCOPED to -p (NOT --all): the path deps would walk into the sibling
      # lance-graph / ndarray workspaces.
      working-directory: tesseract-rs
      run: |
        cargo fmt -p tesseract-core -- --check
        cargo fmt -p tesseract-recognizer -- --check
        cargo fmt -p tesseract-ocr -- --check
        cargo fmt -p tesseract-ocr-pdf -- --check
        cargo fmt -p tesseract-ogar -- --check
        cargo fmt -p tesseract-ocr-web -- --check
        cargo fmt -p tesseract-paperless -- --check
        cargo fmt -p tesseract-paperless-web -- --check

  quality:
    # Slow end-to-end quality-regression tests (~10 min total): the 8+7+0
    # resolution-ladder CER fence (tesseract-ocr) and the typography-overlay
    # PDF fence (tesseract-ocr-pdf). Both read corpus/quality/resgrid.* +
    # corpus/model/eng.lstm* (committed fixtures) and skip gracefully if
    # those are absent, so this job is hermetic but not part of the fast PR
    # gate above — nightly + on-demand + push to master only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    steps:
    # Same sibling-checkout layout as the build job (see comment there):
    # tesseract-core path-deps lance-graph-contract, tesseract-recognizer
    # path-deps ndarray.
    - uses: actions/checkout@v4
      with:
        path: tesseract-rs
    - uses: actions/checkout@v4
      with:
        repository: AdaWorldAPI/lance-graph
        path: lance-graph
    - uses: actions/checkout@v4
      with:
        repository: AdaWorldAPI/ndarray
        path: ndarray
    - uses: actions/checkout@v4
      with:
        repository: AdaWorldAPI/OGAR
        path: OGAR
    # Workspace sweep pin (lance-graph #896 family): 1.97.1, matching the
    # repo's rust-toolchain.toml.
    - name: Rust 1.97.1 toolchain
      run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1
    - name: Quality (resolution ladder, ocr)
      working-directory: tesseract-rs
      run: cargo +1.97.1 test -p tesseract-ocr --test quality_resolution_grid --verbose
    - name: Quality (typography overlay, ocr-pdf)
      working-directory: tesseract-rs
      run: cargo +1.97.1 test -p tesseract-ocr-pdf --test typography_overlay --verbose
