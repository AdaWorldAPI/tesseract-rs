<!DOCTYPE html>
<html lang="en" data-material="physical-glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop &middot; {{ brand_name }}</title>
<link rel="stylesheet" href="/static/physical-glass.css">
<script src="/static/physical-glass.js" data-surfaces=":not(*)" defer></script>
<script src="/static/desktop.js" defer></script>
<style>
  :root { color-scheme: light; --fg: #1b2430; --bg: #e8ecf2; --card-bg: #fff; --border: #d6dce5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: 44px 1fr 40px; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  .top { display: flex; align-items: center; gap: 14px; padding: 0 14px; background: rgb(31 42 58 / .86); color: #e9eef6; backdrop-filter: blur(10px); }
  .top b { font-weight: 600; } .top .sp { flex: 1; }
  .top a, .top button { color: inherit; font: inherit; font-size: 13px; text-decoration: none; padding: 4px 10px; border: 0; border-radius: 6px; background: rgb(255 255 255 / .12); cursor: pointer; }
  .top a:hover, .top button:hover { background: rgb(255 255 255 / .22); }
  .top select { font: inherit; font-size: 12px; border-radius: 6px; border: 0; padding: 3px 6px; }
  .top form { margin: 0; }
  /* The windows sit on #desk and never scroll; the tiles scroll in their own
     layer underneath, so every folder stays reachable however many there are. */
  #desk { position: relative; overflow: hidden; }
  #icons { position: absolute; inset: 0; overflow: auto; padding: 28px 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 112px); gap: 24px 28px; max-width: 1100px; list-style: none; margin: 0; padding: 0; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: inherit; text-align: center; }
  .tile .sq { position: relative; display: grid; place-items: center; width: 96px; height: 96px; border-radius: 24px;
    background: linear-gradient(160deg, rgb(255 255 255 / .72), rgb(214 226 250 / .42));
    border: 1px solid rgb(255 255 255 / .8); box-shadow: inset 0 1px 0 rgb(255 255 255 / .9), inset 0 -10px 22px rgb(120 140 200 / .18), 0 10px 22px rgb(40 52 90 / .18);
    backdrop-filter: blur(14px) saturate(1.3); transition: transform .12s ease, box-shadow .12s ease; }
  .tile .sq svg { width: 44px; height: 44px; fill: none; stroke: #3a4f86; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tile .n { position: absolute; right: -6px; top: -6px; min-width: 24px; padding: 1px 7px; border-radius: 12px; background: #3a4f86; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
  .tile:hover .sq { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgb(255 255 255 / .9), inset 0 -10px 22px rgb(120 140 200 / .2), 0 14px 28px rgb(40 52 90 / .26); }
  .tile:focus-visible { outline: none; } .tile:focus-visible .sq { outline: 2px solid #2f6fd6; outline-offset: 3px; }
  .tile .txt { font-size: 13.5px; line-height: 1.25; word-break: break-word; }
  .errors { margin: 0 0 20px; padding: 10px 14px; border-radius: 10px; background: rgb(255 255 255 / .85); color: #8a1c1c; max-width: 1100px; }
  .win { position: absolute; display: flex; flex-direction: column; background: #fff; border: 1px solid #b9c2cf; border-radius: 10px; box-shadow: 0 14px 44px rgb(20 30 45 / .3); overflow: hidden; min-width: 360px; min-height: 220px; resize: both; }
  .win .bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 12px; background: #eef2f7; border-bottom: 1px solid #d6dce5; cursor: move; user-select: none; }
  .win .bar b { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win .bar button, .win .bar a { display: grid; place-items: center; border: 0; background: transparent; width: 28px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 14px; color: inherit; text-decoration: none; }
  .win .bar button:hover, .win .bar a:hover { background: #dfe5ee; }
  .win iframe { flex: 1; border: 0; width: 100%; }
  .win.min { display: none; }
  #task { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: rgb(31 42 58 / .9); color: #e9eef6; overflow-x: auto; }
  #task button { font: inherit; font-size: 12px; color: inherit; background: rgb(255 255 255 / .08); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  #task button.on { background: rgb(255 255 255 / .24); } #task .sp { flex: 1; }
  #clock { font-variant-numeric: tabular-nums; opacity: .85; }
  @media (max-width: 640px) { #icons { padding: 18px 16px; } .grid { grid-template-columns: repeat(auto-fill, 92px); gap: 18px 16px; } .tile .sq { width: 80px; height: 80px; } }
</style>
</head>
<body data-desktop>
<header class="top">
  <b>{{ brand_name }}</b><span class="sp"></span>
  <select data-pg-bg-choice aria-label="Background"></select>
  <a data-desktop-exit href="/dashboard">Classic view</a>
  {% if sign_in %}<form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>{% endif %}
</header>
<main id="desk"><div id="icons">
{% if !errors.is_empty() %}<div class="errors" role="alert">{% for e in errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
<ul class="grid" aria-label="Folders">
{% for t in tiles %}
  <li><a class="tile" data-win="{{ t.id }}" data-title="{{ t.label }}" href="{{ t.href }}" title="{{ t.hint }}"><span class="sq"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">{{ t.icon|safe }}</svg><span class="n" aria-label="{{ t.count }} documents">{{ t.count }}</span></span><span class="txt" data-pg-on-bg>{{ t.label }}</span></a></li>
{% endfor %}
</ul>
</div></main>
<footer id="task"><span class="sp"></span><span id="clock"></span></footer>
</body>
</html>
