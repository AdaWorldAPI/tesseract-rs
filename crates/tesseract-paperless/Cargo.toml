[package]
name = "tesseract-paperless"
description = "Document intake for the pure-Rust OCR stack: the S-2 dedup gate, the doc.v1 -> DocIr seam, and an optional one-tokenization-many-consumers lexical receipt."
version = "0.0.1"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/AdaWorldAPI/tesseract-rs"

# ---------------------------------------------------------------------------
# WHY THIS CRATE IS IN THIS WORKSPACE, AND WHAT THAT DOES NOT MEAN
# ---------------------------------------------------------------------------
#
# The repo's CLAUDE.md carries an operator-set boundary: "tesseract-rs =
# faithful recognition -> rich doc.v1; the JSON is the OPTIONAL seed a consumer
# feeds (via OGAR) ... Store / graph / KV / PDF-from-data are NOT tesseract-rs
# concerns." This crate is co-located with that rule, not in breach of it, and
# the distinction is worth stating precisely because it is easy to erode:
#
#   1. It is a CONSUMER, and this workspace already hosts consumers —
#      `tesseract-ocr-web`, `-pdf`, `-python`, `-ogar` are all downstream of
#      recognition rather than part of it.
#   2. NO existing crate gains a dependency. `tesseract-core`, `-recognizer`
#      and `-ocr` keep their exact dep sets; recognition stays storage-less,
#      which is what the boundary actually protects.
#   3. There is NO STORE here. `DedupIndex` is a trait and this crate
#      implements no backend — it ships the GATE (a hash, a lookup contract,
#      an ordering rule), never the KV. That is the same line
#      `OGAR-DOC-W4-BUILD-SPEC` draws: "No storage backend chosen (KV blob is
#      the consumer's)."
#
# It lives here rather than in `AdaWorldAPI/paperless-rs` because that repo's
# push is denied at the GitHub-App level, so it has no durable home there.
# tesseract-rs is now the ONE source of truth for this code; the paperless-rs
# branch is a dead copy, archived as a patch under the lance-graph plateau.
# Do not try to keep the two in sync — delete the question, not the drift.

# ---------------------------------------------------------------------------
# FEATURE GATING — a member, deliberately, with the weight optional
# ---------------------------------------------------------------------------
#
# This crate IS a workspace member even though its interesting halves are
# off by default. That is the point: a crate excluded from the workspace is
# never compiled by CI, and an uncompiled crate rots invisibly. This session
# watched exactly that happen to `spider_doc_ir`, which floated on a branch
# dep with nothing building the pair and sat broken for weeks. A member with
# optional deps gets the opposite: the default build is lean AND every
# configuration has a CI line.
#
# The three tiers:
#
#   default   the S-2 gate + `doc.v1` -> `DocIr`. Four small deps, no OCR,
#             no index, no recognizer. This is what an ingest pipeline that
#             already holds doc.v1 JSON needs, and nothing more.
#   ocr       run the recognizer IN-PROCESS. Pulls `tesseract-ogar` and
#             `ndarray` beneath it — real weight for a caller that only
#             converts JSON, which is exactly why it is not the default.
#   token     the lexical seam: ONE versioned BPE tokenization per span,
#             borrowed by an index and a semantic consumer. Pulls Tantivy.

[dependencies]
# The convergence key. tesseract-rs deliberately does NOT stamp a content hash
# (`docs/CONSUMER-GUIDE.md`: "This crate's doc.v1 does NOT stamp a hash") and
# carries no sha2/blake3/digest dependency anywhere else, so computing it is
# this crate's job by design rather than by omission.
sha2 = { version = "0.10", default-features = false }

# The type layer: `FacetCascade` / `NodeGuid`. Zero-dep by construction, and
# already a path dep of `tesseract-core`, so this edge costs nothing new.
lance-graph-contract = { path = "../../../lance-graph/crates/lance-graph-contract" }

# The source-agnostic perceptual IR — the ONE shape a scan and a web page both
# land in, and the document layer's own identity and span addressing. This
# crate reads those rather than minting a parallel `source_id`/`span_id`.
ogar-doc-ir = { path = "../../../OGAR/crates/ogar-doc-ir" }

# The pixel retina's adapter: `doc.v1` JSON -> `DocIr`. serde-only. Note it
# does NOT pull tesseract — a caller already holding doc.v1 from anywhere
# converts with no OCR dependency at all, which is what makes `default` lean.
ogar-from-docv1 = { path = "../../../OGAR/crates/ogar-from-docv1" }

# --- feature `ocr` ---------------------------------------------------------
# The ONE sanctioned recognition entry point (`docs/CONSUMER-GUIDE.md`: never
# call `LstmRecognizer` / `structured` / the renderers directly).
tesseract-ogar = { path = "../tesseract-ogar", optional = true }

# --- feature `token` -------------------------------------------------------
# The lexical index. Fork-only policy; default features OFF because the seam
# indexes in RAM, so mmap/lz4/stemmer are dead weight — and
# `columnar-zstd-compression` would drag `zstd-sys`, a C build, into a tree
# whose entire proposition is that it contains no C.
tantivy = { path = "../../../tantivy", optional = true, default-features = false }

# The semantic consumer. It is a dependency of the PROBES and not of `src/`,
# and that asymmetry is the measured finding rather than an oversight:
# `parse_to_spo(&[Tagged])` consumes `(WordId, Pos)` pairs and touches no
# string, so DeepNSM-v2's library was ALREADY the seam and needed no change to
# borrow the receipt. Nothing in this crate wraps it.
deepnsm-v2 = { path = "../../../lance-graph/crates/deepnsm-v2", optional = true }

[features]
default = []
ocr = ["dep:tesseract-ogar"]
# Enabling this turns on `lance-graph-contract/guid-v3-tail` transitively
# (deepnsm-v2 requires it). Additive, and it is the CORRECT setting — without
# it `mint_for` silently falls back to the V1 tail — but it is a graph-wide
# feature unification, so it is named here rather than discovered later.
token = ["dep:tantivy", "dep:deepnsm-v2"]

# The probes are the evidence for the `token` claims, so they are built with
# it and cannot be built without it.
[[example]]
name = "probe_token_seam"
required-features = ["token"]

[[example]]
name = "probe_tile_head_to_head"
required-features = ["token"]

[[example]]
name = "probe_wordid_vs_tokenid"
required-features = ["token"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
